name: Style and unit tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: "Setup and run tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Style and formatting (ruff)
        run: uv run --no-sync ruff check --show-fixes .

      - name: Formatting (ruff format)
        run: uv run --no-sync ruff format --diff .

      - name: Security scan (bandit)
        run: uv run --no-sync bandit -c pyproject.toml -r .

      - name: Unit and integration tests (pytest)
        run: uv run --no-sync pytest

      - name: Mypy Check
        run: uv run --no-sync mypy .
